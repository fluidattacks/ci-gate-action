name: 'Fluid Attacks CI Gate'
description: 'Check for open vulnerabilities in your repository using the Fluid Attacks CI Gate'
author: 'Fluid Attacks'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  group:
    description: >
      Fluid Attacks group of the repository (passed as --group). Required with
      both ways of authenticating. With OpenID Connect, grant the job
      "permissions: id-token: write" and define a trust for the repository.
    required: true
  api_token:
    description: >
      Group token, used when OpenID Connect is not an option. Pass it from a
      secret. Takes precedence over OpenID Connect. When empty, the action
      authenticates with OpenID Connect.
    required: false
    default: ''
  repo_name:
    description: 'Git repository nickname in the Fluid Attacks platform. Defaults to the GitHub repository name when not set.'
    required: false
    default: ''
  strict:
    description: 'Enable strict mode. Breaks the build if open or untreated vulnerabilities are found.'
    required: false
    default: 'false'
  report_output_path:
    description: 'Path relative to the workspace root where the JSON report will be saved. It must stay inside the workspace. If not set, the report is not saved in the workspace.'
    required: false
    default: ''

outputs:
  vulnerabilities_found:
    description: 'Whether policy-breaking vulnerabilities were found (true/false). Not set when the CI Gate itself fails.'
  report_output_path:
    description: 'Path to the JSON report file. Only set when the report_output_path input is configured.'

runs:
  using: 'node24'
  main: 'dist/index.js'
